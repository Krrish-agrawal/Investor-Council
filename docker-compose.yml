# MySQL only. Switch Console manages Switch's own containers (server, Mattermost) separately.
# Usage: cp .env.example .env  (fill in passwords)  &&  docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: investor-council-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${COUNCIL_DB_NAME:-investor_council}
    ports:
      # Bound to loopback only; never expose the database on the network.
      - "127.0.0.1:${COUNCIL_DB_PORT:-3307}:3306"
    volumes:
      - council_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  council_mysql_data:
