[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investor-council"
version = "0.2.0"
description = "Investor Council: deterministic tools for AI-assisted investment research (not financial advice)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "PyMySQL>=1.1,<2",
  "cryptography>=42",      # PyMySQL needs it for MySQL 8 caching_sha2_password
  "typer>=0.12,<1",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
council = "council.cli.main:app"

[tool.setuptools.packages.find]
include = ["council*"]

[tool.setuptools.package-data]
"council.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "db: needs a reachable MySQL 8 server (see README); skipped otherwise",
]
